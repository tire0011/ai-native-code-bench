name: Benchmark poller adapter (offline)

on:
  pull_request:
    paths:
      - 'poller-run.ps1'
      - 'tests/Test-PollerAdapter.ps1'
      - '.github/workflows/poller-adapter.yml'
  workflow_dispatch:

jobs:
  powershell-adapter:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify legacy benchmark is called once with -NoWatch
        shell: pwsh
        run: ./tests/Test-PollerAdapter.ps1
